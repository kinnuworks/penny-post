[toolchain]
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
penny_post = "D5LZ7kUmpXhE2hsKHnse9itthWHX6j8o4EkGcfz2MLAD"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# The tests run against the real SKR mint and a real Seeker Genesis Token, so
# the local validator reads accounts it does not have from mainnet.
[surfpool]
online = true
datasource_rpc_url = "https://api.mainnet-beta.solana.com"

[scripts]
test = "npx vitest run --testTimeout=60000"

[hooks]
